name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests (stress test at 3,000 operations, new seed each run)
        run: npm test
        env:
          STRESS_OPS: 3000
          STRESS_SEED: ${{ github.run_id }}
      - name: Build
        run: npm run build
